<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Soft Cyan background gradient -->
    <linearGradient id="theory-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA" />
      <stop offset="100%" stop-color="#B2EBF2" />
    </linearGradient>
    
    <!-- Book cover gradient (Blue) -->
    <linearGradient id="book-cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80DEEA" />
      <stop offset="50%" stop-color="#26C6DA" />
      <stop offset="100%" stop-color="#00ACC1" />
    </linearGradient>

    <!-- Deep Blue accent gradient -->
    <linearGradient id="deep-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EA8FF" />
      <stop offset="100%" stop-color="#2B8CFF" />
    </linearGradient>
    
    <!-- Soft shadow -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#485E90" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Soft Cyan circular background -->
  <circle cx="50" cy="50" r="42" fill="url(#theory-bg)" />

  <!-- Music Theory Group with Soft Shadow -->
  <g filter="url(#soft-shadow)">
    <!-- Behind sheet paper -->
    <path d="M 28 32 L 72 26 L 80 62 L 36 68 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8" />
    <line x1="38" y1="36" x2="68" y2="32" stroke="#94A3B8" stroke-width="0.8" />
    <line x1="39" y1="42" x2="69" y2="38" stroke="#94A3B8" stroke-width="0.8" />

    <!-- Open Book Cover (Teal/Blue) -->
    <path d="M 22 42 L 48 38 L 48 72 L 22 76 Z" fill="url(#book-cover)" stroke="#0097A7" stroke-width="0.5" />
    <path d="M 48 38 L 74 42 L 74 76 L 48 72 Z" fill="url(#book-cover)" stroke="#0097A7" stroke-width="0.5" />

    <!-- Open Book Pages (White/Cream) -->
    <path d="M 24 43 L 47 40 L 47 71 L 24 74 Z" fill="#FFFFFF" />
    <path d="M 49 40 L 72 43 L 72 74 L 49 71 Z" fill="#FFFFFF" />

    <!-- Staff Lines on Left Page -->
    <line x1="28" y1="46" x2="43" y2="44" stroke="#94A3B8" stroke-width="0.6" />
    <line x1="28" y1="50" x2="43" y2="48" stroke="#94A3B8" stroke-width="0.6" />
    <line x1="28" y1="54" x2="43" y2="52" stroke="#94A3B8" stroke-width="0.6" />
    <line x1="28" y1="58" x2="43" y2="56" stroke="#94A3B8" stroke-width="0.6" />

    <!-- Staff Lines on Right Page -->
    <line x1="53" y1="44" x2="68" y2="46" stroke="#94A3B8" stroke-width="0.6" />
    <line x1="53" y1="48" x2="68" y2="50" stroke="#94A3B8" stroke-width="0.6" />
    <line x1="53" y1="52" x2="68" y2="54" stroke="#94A3B8" stroke-width="0.6" />
    <line x1="53" y1="56" x2="68" y2="58" stroke="#94A3B8" stroke-width="0.6" />

    <!-- Music Note Elements (Deep Blue Gradient) -->
    <!-- G-Clef / Note on Left Page -->
    <ellipse cx="32" cy="58" rx="2" ry="1.5" fill="url(#deep-blue)" transform="rotate(-15 32 58)" />
    <path d="M 34 58 L 34 46 C 34 46, 38 46, 38 48" stroke="url(#deep-blue)" stroke-width="1.2" fill="none" />

    <!-- Connected Eighth Notes on Right Page -->
    <ellipse cx="58" cy="54" rx="2" ry="1.5" fill="url(#deep-blue)" transform="rotate(-15 58 54)" />
    <ellipse cx="64" cy="55" rx="2" ry="1.5" fill="url(#deep-blue)" transform="rotate(-15 64 55)" />
    <line x1="60" y1="54" x2="60" y2="44" stroke="url(#deep-blue)" stroke-width="1.2" />
    <line x1="66" y1="55" x2="66" y2="45" stroke="url(#deep-blue)" stroke-width="1.2" />
    <line x1="60" y1="44" x2="66" y2="45" stroke="url(#deep-blue)" stroke-width="1.8" />
  </g>

  <!-- Floating music notes -->
  <path d="M 76 22 C 76 23, 75.5 23.5, 75 23.5 C 74.5 23.5, 74 23, 74 22 C 74 21, 74.5 20.5, 75 20.5 L 75 17 L 78.5 16.5 L 78.5 20 Z" fill="#00B8D4" opacity="0.8" />
</svg>
