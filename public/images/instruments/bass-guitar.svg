<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Soft Pink background gradient -->
    <linearGradient id="bass-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F6" />
      <stop offset="100%" stop-color="#FFD6E8" />
    </linearGradient>
    
    <!-- Bass Body Purple gradient -->
    <linearGradient id="bass-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFA7FF" />
      <stop offset="100%" stop-color="#9C27B0" />
    </linearGradient>
    
    <!-- Soft shadow -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#485E90" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Soft Pink circular background -->
  <circle cx="50" cy="50" r="42" fill="url(#bass-bg)" />

  <!-- Bass Guitar Group with Soft Shadow -->
  <g filter="url(#soft-shadow)">
    <!-- Long Neck (angled, dark brown wood) -->
    <path d="M 22 24 L 52 54 L 48 58 L 18 28 Z" fill="#5C4033" />
    <path d="M 21 23 L 51 53" stroke="#2B1810" stroke-width="0.8" />
    
    <!-- Four Thick Strings for Bass -->
    <line x1="20" y1="23.5" x2="49" y2="52.5" stroke="#E2E8F0" stroke-width="0.8" />
    <line x1="21.2" y1="24.7" x2="50.2" y2="53.7" stroke="#E2E8F0" stroke-width="0.8" />
    <line x1="22.4" y1="25.9" x2="51.4" y2="54.9" stroke="#E2E8F0" stroke-width="0.8" />
    <line x1="23.6" y1="27.1" x2="52.6" y2="56.1" stroke="#E2E8F0" stroke-width="0.8" />

    <!-- Headstock with 4 Pegs -->
    <path d="M 14 16 L 24 21 L 21 25 L 11 20 Z" fill="#2B1810" />
    <!-- 4 Silver Bass Pegs (In-line or 2+2) -->
    <circle cx="12" cy="18" r="1.6" fill="#DCEEFF" stroke="#9C27B0" stroke-width="0.5" />
    <circle cx="15" cy="16" r="1.6" fill="#DCEEFF" stroke="#9C27B0" stroke-width="0.5" />
    <circle cx="17.5" cy="21.5" r="1.6" fill="#DCEEFF" stroke="#9C27B0" stroke-width="0.5" />
    <circle cx="20.5" cy="19.5" r="1.6" fill="#DCEEFF" stroke="#9C27B0" stroke-width="0.5" />

    <!-- Bass Guitar Body (Purple Gradient, offset modern horn shape) -->
    <path d="M 52 52 
             C 42 46, 46 32, 58 32 
             C 70 32, 84 44, 78 58 
             C 74 66, 68 76, 56 76 
             C 44 76, 36 66, 42 56 
             C 44 52, 49 53, 52 52 Z" 
          fill="url(#bass-body)" />

    <!-- White Pickguard (Stylized) -->
    <path d="M 50 44 C 44 48, 52 64, 64 62 C 68 56, 60 48, 56 44 Z" fill="#FFFFFF" opacity="0.9" />

    <!-- Dual Pickups (Black Rectangles) -->
    <rect x="52" y="47" width="10" height="3.5" rx="0.5" fill="#1E293B" transform="rotate(45 52 47)" />
    <rect x="57" y="52" width="10" height="3.5" rx="0.5" fill="#1E293B" transform="rotate(45 57 52)" />

    <!-- Bridge & Volume Controls -->
    <rect x="66" y="62" width="10" height="4" fill="#CCCCCC" transform="rotate(45 66 62)" />
    <circle cx="62" cy="68" r="2" fill="#FFFFFF" />
    <circle cx="67" cy="65" r="2" fill="#FFFFFF" />
  </g>

  <!-- Music notes -->
  <path d="M 76 26 C 76 27.5, 74.8 28, 74 28 C 72.8 28, 72 27.5, 72 26 L 72 20 L 77 18 L 77 24 Z" fill="#DFA7FF" opacity="0.8" />
  <path d="M 22 72 C 22 73.5, 20.8 74, 20 74 C 18.8 74, 18 73.5, 18 72 L 18 66 L 23 64 L 23 70 Z" fill="#5C4033" opacity="0.7" />
</svg>
