<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Soft Pink background gradient -->
    <linearGradient id="mic-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F6" />
      <stop offset="100%" stop-color="#FFD6E8" />
    </linearGradient>
    
    <!-- Grille/Body gradient (Pink/Navy) -->
    <linearGradient id="mic-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6FAF" />
      <stop offset="100%" stop-color="#0F2C59" />
    </linearGradient>

    <!-- Chrome details -->
    <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    
    <!-- Soft shadow -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#485E90" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Soft Pink circular background -->
  <circle cx="50" cy="50" r="42" fill="url(#mic-bg)" />

  <!-- Microphone Group with Soft Shadow -->
  <g filter="url(#soft-shadow)">
    <!-- Stand (Navy) -->
    <line x1="50" y1="58" x2="50" y2="76" stroke="#0F2C59" stroke-width="3" />
    <!-- Stand Base -->
    <path d="M 38 76 C 38 72, 62 72, 62 76 Z" fill="#0F2C59" />

    <!-- U-Shape Mount -->
    <path d="M 36 38 C 36 56, 64 56, 64 38" fill="none" stroke="url(#chrome-grad)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Connection joints -->
    <circle cx="36" cy="38" r="2.5" fill="#0F2C59" />
    <circle cx="64" cy="38" r="2.5" fill="#0F2C59" />

    <!-- Microphone Body (Navy/Pink Gradient) -->
    <rect x="42" y="32" width="16" height="24" rx="4" fill="url(#mic-body)" stroke="#0F2C59" stroke-width="0.8" />
    
    <!-- Metal Band -->
    <rect x="42" y="44" width="16" height="2.5" fill="url(#chrome-grad)" />

    <!-- Grille (Mesh pattern/dome) -->
    <path d="M 42 32 C 42 22, 58 22, 58 32 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="0.5" />
    <!-- Grille details (crosshatch lines) -->
    <path d="M 45 24 L 55 32 M 48 22 L 58 30 M 55 24 L 45 32 M 58 22 L 48 30" stroke="#94A3B8" stroke-width="0.6" opacity="0.6" />
    <!-- Grille horizontal rim -->
    <path d="M 42 32 L 58 32" stroke="#0F2C59" stroke-width="1.5" />
  </g>

  <!-- Small music notes -->
  <path d="M 24 26 C 24 27, 23.5 27.5, 23 27.5 C 22.5 27.5, 22 27, 22 26 C 22 25, 22.5 24.5, 23 24.5 L 23 21 L 26.5 20.5 L 26.5 24 Z" fill="#FF6FAF" opacity="0.8" />
  <path d="M 76 22 C 76 23.5, 74.8 24, 74 24 C 72.8 24, 72 23.5, 72 22 L 72 16 L 78 14 L 78 20 Z" fill="#0F2C59" opacity="0.8" />
</svg>
