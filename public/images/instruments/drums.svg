<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Soft Cyan background gradient -->
    <linearGradient id="drums-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA" />
      <stop offset="100%" stop-color="#B2EBF2" />
    </linearGradient>
    
    <!-- Drum Shell gradient (Navy/Sky Blue) -->
    <linearGradient id="drum-shell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#33B3FF" />
      <stop offset="100%" stop-color="#0F2C59" />
    </linearGradient>

    <!-- Cymbal Gold gradient -->
    <linearGradient id="cymbal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
    
    <!-- Soft shadow -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#485E90" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Soft Cyan circular background -->
  <circle cx="50" cy="50" r="42" fill="url(#drums-bg)" />

  <!-- Drums Group with Soft Shadow -->
  <g filter="url(#soft-shadow)">
    <!-- Cymbal Stand (Navy/Chrome) -->
    <line x1="28" y1="28" x2="28" y2="72" stroke="#0F2C59" stroke-width="2" />
    <path d="M 20 72 L 36 72 M 28 72 L 28 66" stroke="#0F2C59" stroke-width="2" stroke-linecap="round" />

    <!-- Cymbal (Gold, angled) -->
    <ellipse cx="28" cy="28" rx="14" ry="4" fill="url(#cymbal-grad)" stroke="#FF8F00" stroke-width="0.8" />
    <path d="M 28 28 L 28 26" stroke="#0F2C59" stroke-width="1.5" />

    <!-- Snare Stand -->
    <line x1="60" y1="52" x2="60" y2="76" stroke="#0F2C59" stroke-width="2" />
    <path d="M 52 76 L 68 76" stroke="#0F2C59" stroke-width="2" stroke-linecap="round" />

    <!-- Snare Drum (Sky Blue + Navy Gradient) -->
    <rect x="42" y="40" width="36" height="15" rx="2" fill="url(#drum-shell)" stroke="#0F2C59" stroke-width="0.8" />
    <!-- Top & Bottom Rims -->
    <ellipse cx="60" cy="40" rx="18" ry="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />
    <ellipse cx="60" cy="55" rx="18" ry="4" fill="#64748B" stroke="#0F2C59" stroke-width="0.8" />
    
    <!-- Tension rods (Vertical chrome bars) -->
    <line x1="46" y1="42" x2="46" y2="53" stroke="#CCCCCC" stroke-width="1" />
    <line x1="53" y1="43" x2="53" y2="54" stroke="#CCCCCC" stroke-width="1" />
    <line x1="60" y1="44" x2="60" y2="55" stroke="#CCCCCC" stroke-width="1" />
    <line x1="67" y1="43" x2="67" y2="54" stroke="#CCCCCC" stroke-width="1" />
    <line x1="74" y1="42" x2="74" y2="53" stroke="#CCCCCC" stroke-width="1" />

    <!-- Drumsticks (Crossing, natural wood color) -->
    <line x1="38" y1="36" x2="74" y2="50" stroke="#FFDCA3" stroke-width="1.8" stroke-linecap="round" />
    <line x1="78" y1="32" x2="44" y2="52" stroke="#FFDCA3" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="74" cy="50" r="1.2" fill="#FFB74D" />
    <circle cx="44" cy="52" r="1.2" fill="#FFB74D" />
  </g>

  <!-- Floating music notes -->
  <path d="M 44 22 C 44 23, 43.5 23.5, 43 23.5 C 42.5 23.5, 42 23, 42 22 C 42 21, 42.5 20.5, 43 20.5 L 43 17 L 46.5 16.5 L 46.5 20 Z" fill="#00B8D4" opacity="0.8" />
  <path d="M 82 24 C 82 25.5, 80.8 26, 80 26 C 78.8 26, 78 25.5, 78 24 L 78 18 L 84 16 L 84 22 Z" fill="#33B3FF" opacity="0.8" />
</svg>
