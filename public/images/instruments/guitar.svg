<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Soft Blue background gradient -->
    <linearGradient id="guitar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F7FF" />
      <stop offset="100%" stop-color="#DCEEFF" />
    </linearGradient>
    
    <!-- Guitar Body Blue gradient -->
    <linearGradient id="guitar-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EA8FF" />
      <stop offset="100%" stop-color="#2B8CFF" />
    </linearGradient>
    
    <!-- Soft shadow -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#485E90" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Soft Blue circular background -->
  <circle cx="50" cy="50" r="42" fill="url(#guitar-bg)" />

  <!-- Guitar Group with Soft Shadow -->
  <g filter="url(#soft-shadow)">
    <!-- Neck (angled, brown wood accent) -->
    <path d="M 28 28 L 52 52 L 48 56 L 24 32 Z" fill="#8B5A2B" />
    <path d="M 27 27 L 51 51" stroke="#3E2723" stroke-width="0.8" />
    
    <!-- Strings -->
    <line x1="26" y1="28" x2="52" y2="54" stroke="#E2E8F0" stroke-width="0.5" />
    <line x1="27" y1="29" x2="53" y2="55" stroke="#E2E8F0" stroke-width="0.5" />
    <line x1="28" y1="30" x2="54" y2="56" stroke="#E2E8F0" stroke-width="0.5" />

    <!-- Headstock -->
    <path d="M 20 20 L 29 25 L 26 29 L 17 24 Z" fill="#3E2723" />
    <!-- Tuners -->
    <circle cx="18" cy="21" r="1.2" fill="#E2E8F0" />
    <circle cx="21" cy="19" r="1.2" fill="#E2E8F0" />
    <circle cx="25" cy="22" r="1.2" fill="#E2E8F0" />

    <!-- Guitar Body (Blue Gradient + Brown Accents) -->
    <!-- Beautiful classic shape rotated at 45deg -->
    <path d="M 52 52 
             C 44 48, 48 36, 60 36 
             C 72 36, 82 48, 76 60 
             C 72 66, 66 76, 56 76 
             C 46 76, 38 68, 44 58 
             C 46 54, 50 54, 52 52 Z" 
          fill="url(#guitar-body)" />

    <!-- Pickguard (Dark Brown) -->
    <path d="M 56 46 C 54 48, 52 55, 55 60 C 58 60, 60 52, 60 48 Z" fill="#3E2723" opacity="0.85" />

    <!-- Soundhole -->
    <circle cx="60" cy="54" r="6" fill="#1E293B" stroke="#8B5A2B" stroke-width="1.2" />

    <!-- Bridge -->
    <rect x="64" y="62" width="12" height="4" rx="1" fill="#8B5A2B" transform="rotate(45 64 62)" />
  </g>

  <!-- Floating music notes -->
  <path d="M 76 28 C 76 29.5, 74.8 30, 74 30 C 72.8 30, 72 29.5, 72 28 C 72 26.8, 72.8 26, 74 26 L 74 18 L 80 16 L 80 24 Z" fill="#5EA8FF" opacity="0.8" />
  <path d="M 22 72 C 22 73, 21.2 73.5, 20.5 73.5 C 19.8 73.5, 19.2 73, 19.2 72 C 19.2 71, 19.8 70.5, 20.5 70.5 L 20.5 66 L 24 65 L 24 69 Z" fill="#8B5A2B" opacity="0.7" />
</svg>
