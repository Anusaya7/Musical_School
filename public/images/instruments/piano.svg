<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Soft Pink background gradient -->
    <linearGradient id="piano-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F6" />
      <stop offset="100%" stop-color="#FFD6E8" />
    </linearGradient>
    
    <!-- Lavender & Pink body gradient -->
    <linearGradient id="piano-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DFA7FF" />
      <stop offset="100%" stop-color="#FF6FAF" />
    </linearGradient>
    
    <!-- Soft shadow -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#485E90" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Soft Pink circular background -->
  <circle cx="50" cy="50" r="42" fill="url(#piano-bg)" />

  <!-- Piano Group with Soft Shadow -->
  <g filter="url(#soft-shadow)">
    <!-- Piano Body (Lavender/Pink Accent) -->
    <path d="M 22 36 C 22 32, 78 32, 78 36 L 78 52 C 78 55, 75 58, 72 58 L 28 58 C 25 58, 22 55, 22 52 Z" fill="url(#piano-body)" />
    
    <!-- Music Stand/Sheet Holder -->
    <path d="M 40 32 L 60 32 L 57 26 L 43 26 Z" fill="#DFA7FF" opacity="0.8" />
    
    <!-- Sheet Music -->
    <rect x="45" y="24" width="10" height="8" rx="1" fill="#FFFFFF" />
    <line x1="47" y1="27" x2="53" y2="27" stroke="#FF6FAF" stroke-width="0.8" />
    <line x1="47" y1="29" x2="51" y2="29" stroke="#FF6FAF" stroke-width="0.8" />

    <!-- Keyboard Bed (White) -->
    <rect x="25" y="46" width="50" height="10" rx="1.5" fill="#FFFFFF" />

    <!-- White Keys Separators -->
    <line x1="29" y1="46" x2="29" y2="56" stroke="#E2E8F0" stroke-width="0.8" />
    <line x1="33" y1="46" x2="33" y2="56" stroke="#E2E8F0" stroke-width="0.8" />
    <line x1="37" y1="46" x2="37" y2="56" stroke="#E2E8F0" stroke-width="0.8" />
    <line x1="41" y1="46" x2="41" y2="56" stroke="#E2E8F0" stroke-width="0.8" />
    <line x1="45" y1="46" x2="45" y2="56" stroke="#E2E8F0" stroke-width="0.8" />
    <line x1="49" y1="46" x2="49" y2="56" stroke="#E2E8F0" stroke-width="0.8" />
    <line x1="53" y1="46" x2="53" y2="56" stroke="#E2E8F0" stroke-width="0.8" />
    <line x1="57" y1="46" x2="57" y2="56" stroke="#E2E8F0" stroke-width="0.8" />
    <line x1="61" y1="46" x2="61" y2="56" stroke="#E2E8F0" stroke-width="0.8" />
    <line x1="65" y1="46" x2="65" y2="56" stroke="#E2E8F0" stroke-width="0.8" />
    <line x1="69" y1="46" x2="69" y2="56" stroke="#E2E8F0" stroke-width="0.8" />
    <line x1="73" y1="46" x2="73" y2="56" stroke="#E2E8F0" stroke-width="0.8" />

    <!-- Black Keys -->
    <rect x="27.5" y="46" width="3" height="6.5" rx="0.5" fill="#1E293B" />
    <rect x="31.5" y="46" width="3" height="6.5" rx="0.5" fill="#1E293B" />
    
    <rect x="39.5" y="46" width="3" height="6.5" rx="0.5" fill="#1E293B" />
    <rect x="43.5" y="46" width="3" height="6.5" rx="0.5" fill="#1E293B" />
    <rect x="47.5" y="46" width="3" height="6.5" rx="0.5" fill="#1E293B" />
    
    <rect x="55.5" y="46" width="3" height="6.5" rx="0.5" fill="#1E293B" />
    <rect x="59.5" y="46" width="3" height="6.5" rx="0.5" fill="#1E293B" />
    
    <rect x="67.5" y="46" width="3" height="6.5" rx="0.5" fill="#1E293B" />
    <rect x="71.5" y="46" width="3" height="6.5" rx="0.5" fill="#1E293B" />
  </g>

  <!-- Small floating music notes -->
  <path d="M 22 26 C 22 28, 20 29, 18 29 C 16.5 29, 15.5 28, 15.5 26.5 C 15.5 25, 17 24, 18.5 24 L 18.5 18 L 24 16.5 L 24 22 L 20 23 L 20 26 Z" fill="#DFA7FF" opacity="0.8" />
  <path d="M 80 24 C 80 25.5, 78.5 26.5, 77 26.5 C 75.5 26.5, 74.5 25.5, 74.5 24 C 74.5 22.5, 75.5 21.5, 77 21.5 L 77 16 L 82 18 L 82 22 Z" fill="#FF6FAF" opacity="0.8" />
  <path d="M 50 14 C 50 14.8, 49.2 15.2, 48.5 15.2 C 47.8 15.2, 47.2 14.8, 47.2 14 C 47.2 13.2, 47.8 12.8, 48.5 12.8 L 48.5 10 L 52 11 L 52 13 Z" fill="#FFFFFF" opacity="0.9" />
</svg>
